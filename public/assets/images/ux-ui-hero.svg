<svg
  viewBox="0 0 1200 800"
  preserveAspectRatio="xMidYMid slice"
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
>
  <defs>
    <filter id="uh-shadow-md" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="uh-shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="uh-glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="uh-glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="uh-graph-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
    </linearGradient>
    <marker id="uh-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6" />
    </marker>
    <pattern id="uh-dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.04" />
    </pattern>
  </defs>

  <style>
    :root { --uh-dur: 14s; }

    .uh-cursor {
      animation: uhCursorPath var(--uh-dur) ease-in-out infinite;
      transform-origin: 0px 0px;
    }
    @keyframes uhCursorPath {
      0%        { transform: translate(200px, 800px); }
      8%        { transform: translate(142px, 247px); scale: 1; }
      12%       { transform: translate(142px, 247px); scale: 0.8; }
      15%       { transform: translate(142px, 247px); scale: 1; }
      22%       { transform: translate(900px, 550px); }
      30%       { transform: translate(900px, 550px); }
      38%       { transform: translate(580px, 350px); scale: 1; }
      40%       { transform: translate(580px, 350px); scale: 0.8; }
      55%       { transform: translate(840px, 140px); scale: 0.8; }
      58%       { transform: translate(840px, 140px); scale: 1; }
      68%       { transform: translate(1010px, 112px); scale: 1; }
      72%       { transform: translate(1010px, 112px); scale: 0.8; }
      75%       { transform: translate(1010px, 112px); scale: 1; }
      85%, 100% { transform: translate(1300px, 800px); }
    }

    .uh-ripple {
      animation: uhRipple var(--uh-dur) ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes uhRipple {
      0%, 11%   { r: 0; opacity: 0; }
      12%       { r: 10; opacity: 0.5; }
      15%, 39%  { r: 30; opacity: 0; }
      40%       { r: 10; opacity: 0.5; }
      43%, 71%  { r: 30; opacity: 0; }
      72%       { r: 10; opacity: 0.5; }
      75%, 100% { r: 30; opacity: 0; }
    }

    .uh-box { animation: uhSelectBox var(--uh-dur) ease-in-out infinite; }
    @keyframes uhSelectBox {
      0%, 11%   { opacity: 0; }
      12%, 39%  { opacity: 1; }
      40%, 100% { opacity: 0; }
    }

    .uh-toggle-bg { animation: uhToggleBg var(--uh-dur) ease-in-out infinite; }
    @keyframes uhToggleBg {
      0%, 11%   { fill: #374151; }
      12%, 95%  { fill: #10B981; }
      96%, 100% { fill: #374151; }
    }

    .uh-toggle-circle { animation: uhToggleCircle var(--uh-dur) ease-in-out infinite; }
    @keyframes uhToggleCircle {
      0%, 11%   { transform: translateX(0); fill: #9CA3AF; }
      12%, 95%  { transform: translateX(24px); fill: #ffffff; }
      96%, 100% { transform: translateX(0); fill: #9CA3AF; }
    }

    .uh-graph-hover { animation: uhGraphHover var(--uh-dur) ease-in-out infinite; }
    @keyframes uhGraphHover {
      0%, 20%   { opacity: 0; transform: translateY(10px); }
      22%, 32%  { opacity: 1; transform: translateY(0); }
      34%, 100% { opacity: 0; transform: translateY(10px); }
    }

    .uh-card {
      animation: uhCardDrag var(--uh-dur) ease-in-out infinite;
      transform-origin: 160px 90px;
    }
    @keyframes uhCardDrag {
      0%, 39%   { transform: translate(420px, 260px) rotate(0deg) scale(1); opacity: 1; }
      40%       { transform: translate(420px, 260px) rotate(0deg) scale(1.05); opacity: 1; }
      55%       { transform: translate(680px, 50px) rotate(8deg) scale(1.05); opacity: 1; }
      58%, 93%  { transform: translate(680px, 50px) rotate(8deg) scale(1); opacity: 1; }
      94%       { transform: translate(680px, 50px) rotate(8deg) scale(1); opacity: 0; }
      95%, 100% { transform: translate(420px, 260px) rotate(0deg) scale(1); opacity: 0; }
    }

    .uh-trail { animation: uhTrail var(--uh-dur) ease-in-out infinite; }
    @keyframes uhTrail {
      0%, 39%   { opacity: 0; }
      40%, 58%  { opacity: 0.8; }
      65%, 100% { opacity: 0; }
    }

    .uh-toast { animation: uhToast var(--uh-dur) ease-in-out infinite; }
    @keyframes uhToast {
      0%, 58%   { opacity: 0; transform: translate(900px, 40px); }
      62%, 90%  { opacity: 1; transform: translate(900px, 80px); }
      95%, 100% { opacity: 0; transform: translate(900px, 40px); }
    }

    .uh-check {
      animation: uhDrawCheck var(--uh-dur) ease-in-out infinite;
      stroke-dasharray: 20;
    }
    @keyframes uhDrawCheck {
      0%, 62%   { stroke-dashoffset: 20; }
      66%, 100% { stroke-dashoffset: 0; }
    }

    .uh-flow { animation: uhFlowDash 1.5s linear infinite; }
    @keyframes uhFlowDash { to { stroke-dashoffset: -20; } }

    .uh-float { animation: uhFloat 4s ease-in-out infinite; }
    @keyframes uhFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
  </style>

  <!-- Dot grid overlay -->
  <rect width="100%" height="100%" fill="url(#uh-dots)" />

  <!-- Ambient decoration -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.06">
    <path d="M 150 140 L 150 160 M 140 150 L 160 150" />
    <path d="M 1050 200 L 1050 220 M 1040 210 L 1060 210" />
    <path d="M 900 700 L 900 720 M 890 710 L 910 710" />
    <circle cx="300" cy="700" r="8" fill="none" />
    <circle cx="850" cy="100" r="12" fill="none" stroke-dasharray="4" />
  </g>

  <!-- Settings component (left) -->
  <g transform="translate(100, 120)" filter="url(#uh-shadow-md)">
    <rect width="280" height="200" rx="16" fill="#11141D" stroke="#2A3040" stroke-width="1.5" />
    <text x="30" y="45" fill="#9CA3AF" font-size="14" font-weight="600" letter-spacing="1">SETTINGS COMPONENT</text>
    <rect x="30" y="70" width="48" height="24" rx="12" fill="#10B981" />
    <circle cx="66" cy="82" r="8" fill="#ffffff" filter="url(#uh-shadow-md)" />
    <rect x="95" y="78" width="120" height="8" rx="4" fill="#E5E7EB" />
    <rect class="uh-toggle-bg" x="30" y="115" width="48" height="24" rx="12" />
    <circle class="uh-toggle-circle" cx="42" cy="127" r="8" />
    <rect x="95" y="123" width="80" height="8" rx="4" fill="#4B5563" />
    <rect x="30" y="165" width="220" height="6" rx="3" fill="#374151" />
    <rect x="30" y="165" width="140" height="6" rx="3" fill="#3B82F6" />
    <circle cx="170" cy="168" r="10" fill="#ffffff" filter="url(#uh-shadow-md)" />
    <g class="uh-box">
      <rect x="-12" y="-12" width="304" height="224" rx="4" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 6" />
      <rect x="-16" y="-16" width="10" height="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2" />
      <rect x="286" y="-16" width="10" height="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2" />
      <rect x="-16" y="206" width="10" height="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2" />
      <rect x="286" y="206" width="10" height="10" fill="#ffffff" stroke="#3B82F6" stroke-width="2" />
    </g>
  </g>

  <!-- Drag trail -->
  <g class="uh-trail">
    <path d="M 580 350 C 650 200, 750 200, 800 180" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="10 10" opacity="0.8" class="uh-flow" />
    <circle cx="653" cy="265" r="4" fill="#8B5CF6" />
    <circle cx="733" cy="208" r="4" fill="#8B5CF6" />
  </g>

  <!-- Ghost / drop zone -->
  <g transform="translate(420, 260)">
    <rect width="320" height="180" rx="16" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="10 10" opacity="0.6" />
    <rect x="24" y="24" width="272" height="80" rx="8" fill="#1F2937" opacity="0.3" />
    <rect x="24" y="124" width="180" height="12" rx="6" fill="#374151" opacity="0.5" />
    <rect x="24" y="148" width="120" height="10" rx="5" fill="#374151" opacity="0.5" />
  </g>

  <!-- Animated drag card -->
  <g class="uh-card">
    <rect width="320" height="180" rx="16" fill="#131722" stroke="#8B5CF6" stroke-width="2" filter="url(#uh-glow-purple)" />
    <rect x="24" y="24" width="272" height="80" rx="8" fill="#1E2433" />
    <circle cx="160" cy="64" r="16" fill="#ffffff" opacity="0.9" filter="url(#uh-shadow-md)" />
    <polygon points="156,58 156,70 166,64" fill="#131722" />
    <rect x="24" y="124" width="200" height="12" rx="6" fill="#ffffff" />
    <rect x="24" y="148" width="140" height="8" rx="4" fill="#9CA3AF" />
    <rect x="220" y="124" width="76" height="32" rx="8" fill="#3B82F6" />
    <rect x="238" y="137" width="40" height="6" rx="3" fill="#ffffff" />
  </g>

  <!-- Dashboard / data viz -->
  <g transform="translate(650, 420)" filter="url(#uh-shadow-md)">
    <rect width="450" height="300" rx="20" fill="#11141D" stroke="#2A3040" stroke-width="1" />
    <rect x="30" y="30" width="120" height="14" rx="7" fill="#E5E7EB" />
    <rect x="30" y="55" width="200" height="10" rx="5" fill="#6B7280" />
    <circle cx="420" cy="37" r="3" fill="#9CA3AF" />
    <circle cx="420" cy="45" r="3" fill="#9CA3AF" />
    <circle cx="420" cy="53" r="3" fill="#9CA3AF" />
    <path d="M 30 250 L 30 180 Q 100 120 180 160 T 320 100 T 420 140 L 420 250 Z" fill="url(#uh-graph-fill)" />
    <path d="M 30 180 Q 100 120 180 160 T 320 100 T 420 140" fill="none" stroke="#3B82F6" stroke-width="4" filter="url(#uh-glow-blue)" />
    <line x1="30" y1="250" x2="420" y2="250" stroke="#2A3040" stroke-width="1.5" />
    <line x1="30" y1="200" x2="420" y2="200" stroke="#2A3040" stroke-width="1.5" stroke-dasharray="6 4" />
    <line x1="30" y1="150" x2="420" y2="150" stroke="#2A3040" stroke-width="1.5" stroke-dasharray="6 4" />
    <line x1="30" y1="100" x2="420" y2="100" stroke="#2A3040" stroke-width="1.5" stroke-dasharray="6 4" />
    <g transform="translate(250, 0)" class="uh-graph-hover">
      <line x1="0" y1="80" x2="0" y2="250" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 4" />
      <circle cx="0" cy="130" r="7" fill="#11141D" stroke="#ffffff" stroke-width="3" filter="url(#uh-glow-blue)" />
      <g transform="translate(-50, 40)" filter="url(#uh-shadow-md)">
        <rect width="100" height="56" rx="8" fill="#ffffff" />
        <polygon points="45,56 55,56 50,62" fill="#ffffff" />
        <rect x="15" y="15" width="70" height="10" rx="5" fill="#111827" />
        <rect x="15" y="32" width="40" height="8" rx="4" fill="#6B7280" />
      </g>
    </g>
  </g>

  <!-- Sidebar nav (left-bottom) -->
  <g transform="translate(100, 480)" filter="url(#uh-shadow-md)">
    <rect width="200" height="240" rx="16" fill="#11141D" stroke="#2A3040" stroke-width="1.5" />
    <circle cx="45" cy="45" r="20" fill="#2A3040" />
    <rect x="80" y="35" width="90" height="10" rx="5" fill="#E5E7EB" />
    <rect x="80" y="52" width="60" height="6" rx="3" fill="#6B7280" />
    <line x1="25" y1="85" x2="175" y2="85" stroke="#2A3040" stroke-width="1.5" />
    <rect x="20" y="105" width="160" height="36" rx="8" fill="#3B82F6" opacity="0.1" />
    <rect x="35" y="119" width="12" height="12" rx="3" fill="#3B82F6" />
    <rect x="60" y="122" width="80" height="6" rx="3" fill="#3B82F6" />
    <rect x="35" y="165" width="12" height="12" rx="3" fill="#4B5563" />
    <rect x="60" y="168" width="100" height="6" rx="3" fill="#6B7280" />
    <rect x="35" y="205" width="12" height="12" rx="3" fill="#4B5563" />
    <rect x="60" y="208" width="70" height="6" rx="3" fill="#6B7280" />
  </g>

  <!-- Flow lines -->
  <path class="uh-flow" d="M 380 200 C 420 200, 420 250, 420 300" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="10 10" opacity="0.6" marker-end="url(#uh-arrow)" />
  <path class="uh-flow" d="M 310 600 C 450 600, 500 550, 630 550" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="10 10" opacity="0.8" marker-end="url(#uh-arrow)" filter="url(#uh-glow-blue)" />

  <!-- Toast -->
  <g class="uh-toast" filter="url(#uh-shadow-md)">
    <rect width="220" height="64" rx="12" fill="#1E2433" stroke="#10B981" stroke-width="1.5" />
    <circle cx="32" cy="32" r="12" fill="#10B981" opacity="0.2" />
    <path class="uh-check" d="M 26 32 L 30 36 L 38 27" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="56" y="22" width="120" height="8" rx="4" fill="#ffffff" />
    <rect x="56" y="38" width="80" height="6" rx="3" fill="#9CA3AF" />
  </g>

  <!-- FAB -->
  <g class="uh-float" transform="translate(500, 650)" filter="url(#uh-shadow-lg)">
    <circle cx="30" cy="30" r="30" fill="#3B82F6" />
    <line x1="30" y1="18" x2="30" y2="42" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="18" y1="30" x2="42" y2="30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Glow accents -->
  <circle cx="420" cy="300" r="6" fill="#3B82F6" filter="url(#uh-glow-blue)" />
  <circle cx="630" cy="550" r="6" fill="#F59E0B" filter="url(#uh-glow-blue)" />

  <!-- Cursor -->
  <g class="uh-cursor" filter="url(#uh-shadow-md)">
    <path d="M0,0 L0,22 L6,16 L11,26 L16,24 L11,14 L18,14 Z" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
    <circle class="uh-ripple" cx="2" cy="2" r="0" fill="none" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>
